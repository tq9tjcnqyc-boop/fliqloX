<style>
/* ── 网页版附加样式（放在原版 CSS 之后，确保优先级）── */

html,body{width:100%;height:100%;overflow:hidden;background:#000}

/* 舞台居中：原版 CSS 靠 #main 的绝对定位，这里用 flex 兜住各种窗口尺寸 */
body{
  display:flex;
  align-items:center;
  justify-content:center;
}

/* 首次进入的提示，几秒后自己淡掉 */
#fliqloX-hint{
  position:fixed;
  left:50%; bottom:28px;
  transform:translateX(-50%);
  color:rgba(255,255,255,.34);
  font:400 13px/1.5 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  letter-spacing:.04em;
  text-align:center;
  pointer-events:none;
  opacity:1;
  transition:opacity .8s ease-out;
  z-index:300;
}
#fliqloX-hint.gone{opacity:0}
#fliqloX-hint kbd{
  font:inherit;
  border:1px solid rgba(255,255,255,.22);
  border-radius:4px;
  padding:1px 5px;
  margin:0 2px;
}

/* 秒 / 日期（扩展功能，默认关闭） */
#fliqloX-seconds{
  position:fixed;
  right:0; bottom:0;
  padding:14px 20px;
  color:rgba(255,255,255,.30);
  font:400 15px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  letter-spacing:.08em;
  pointer-events:none;
  z-index:200;
}
#fliqloX-date{
  position:fixed;
  left:0; bottom:0;
  padding:14px 20px;
  color:rgba(255,255,255,.30);
  font:400 15px/1 -apple-system,"Segoe UI","PingFang SC",sans-serif;
  letter-spacing:.06em;
  pointer-events:none;
  z-index:200;
}

@media (max-width:640px){
  #fliqloX-hint{bottom:18px;font-size:11px}
  #fliqloX-seconds,#fliqloX-date{font-size:12px;padding:10px 14px}
}
</style>

<script>
/* ============================================================================
 * fliqloX.js —— Fliqlo 翻页钟的保真复刻 + 扩展（网页版 / 零依赖）
 *
 * 复用原版资产：fliqlo.css（全部视觉）、fliqlo.woff2（10 个数字字形）
 * 逻辑按解包后的原版逐条对齐：
 *   · 翻转方向判定 isHurOne / isHurEleven / isMinEleven …（原样照抄）
 *   · 8 个克隆层的构建与命名规则
 *   · _updateTime 的 250ms 轮询与 hlock/mlock 锁
 *   · _updateFlips 的动画编排（top-clone 先转、org 层 fadein、bottom-org fadeout1）
 *
 * 与桌面版唯一的区别：不再依赖 jQuery —— 原版那个 jQuery 是作者自己裁剪的
 * 构建，一个时钟页面背上它不划算。这里用原生 DOM，行为逐条对齐。
 *
 * 所有扩展功能默认关闭 —— 开箱行为与原版一致。
 * ========================================================================== */

(function () {
    'use strict';

    /* ------------------------------------------------------------------ *
     * 0. 平台探测（照原版）
     * ------------------------------------------------------------------ */
    var ua            = navigator.userAgent;
    var isScreensaver = ua.indexOf('Fliqlo') >= 0 && ua.indexOf('Screensaver') >= 0;
    var isMobileApp   = isScreensaver && ua.indexOf('MobileApp') >= 0;
    var isMac         = isScreensaver && ua.indexOf('Mac') >= 0;

    /* ------------------------------------------------------------------ *
     * 1. 配置
     *    原版存 localStorage；网页版额外支持 URL 参数与宿主下发
     * ------------------------------------------------------------------ */
    var DEFAULTS = {
        tf: 0,           // 时间格式：0 = 12 小时制，1 = 24 小时制
        sc: 100,         // 缩放 50–100
        br: 100,         // 亮度 25–100
        bg: true,        // 深色底（对应 CSS 的 dark 类）
        bc: true,        // 亮度开关：false = 忽略 br，亮度强制 100%
                         //   （曾误注为「描边」——原版设置面板里没有此项，
                         //     CSS 里也没有任何可开关的描边，是臆想出来的）

        // ── 扩展项，默认关闭，保证与原版一致 ──
        showSeconds: false,
        showDate:    false,
        showWeekday: false,
        locale:      'zh-Hans'
    };

    var SC_MIN = 50, SC_MAX = 100;
    var BR_MIN = 25, BR_MAX = 100;

    var cfg = {};
    for (var k in DEFAULTS) if (DEFAULTS.hasOwnProperty(k)) cfg[k] = DEFAULTS[k];

    function saveConfig() {
        try { localStorage.setItem('fliqloXConfig', JSON.stringify(cfg)); } catch (e) {}
        postToHost({ event: 'saveConfig', config: cfg });
    }

    function loadConfig() {
        // ① 宿主下发（桌面版）
        if (window.__fliqloXBootConfig) mergeConfig(window.__fliqloXBootConfig);

        // ② URL 参数：?tf=1&sc=80&sec=1 —— 方便分享特定设置的链接
        try {
            var qs = new URLSearchParams(location.search);
            if (qs.has('tf'))  cfg.tf = parseInt(qs.get('tf'), 10) === 1 ? 1 : 0;
            if (qs.has('sc'))  cfg.sc = clamp(parseInt(qs.get('sc'), 10), SC_MIN, SC_MAX);
            if (qs.has('br'))  cfg.br = clamp(parseInt(qs.get('br'), 10), BR_MIN, BR_MAX);
            if (qs.has('bg'))  cfg.bg = qs.get('bg') !== '0';
            if (qs.has('bc'))  cfg.bc = qs.get('bc') !== '0';
            if (qs.has('sec')) cfg.showSeconds = qs.get('sec') === '1';
            if (qs.has('date')) cfg.showDate = qs.get('date') === '1';
            if (qs.has('week')) cfg.showWeekday = qs.get('week') === '1';
        } catch (e) {}

        // ③ 本地保存的偏好
        try {
            var raw = localStorage.getItem('fliqloXConfig');
            if (raw) mergeConfig(JSON.parse(raw));
        } catch (e) {}
    }

    function mergeConfig(src) {
        if (!src || typeof src !== 'object') return;
        for (var key in DEFAULTS) {
            if (DEFAULTS.hasOwnProperty(key) && src.hasOwnProperty(key) && src[key] !== undefined) {
                cfg[key] = src[key];
            }
        }
        cfg.sc = clamp(cfg.sc, SC_MIN, SC_MAX);
        cfg.br = clamp(cfg.br, BR_MIN, BR_MAX);
    }

    function clamp(v, lo, hi) {
        v = parseInt(v, 10);
        if (isNaN(v)) return hi;
        return v < lo ? lo : (v > hi ? hi : v);
    }

    function postToHost(payload) {
        var handlers = window.webkit && window.webkit.messageHandlers;
        if (handlers && handlers.fliqloX) {
            try { handlers.fliqloX.postMessage(payload); } catch (e) {}
        }
    }

    /* ------------------------------------------------------------------ *
     * 2. 运行时状态（沿用原版命名，便于对照）
     * ------------------------------------------------------------------ */
    var tf = cfg.tf, sc = cfg.sc, br = cfg.br, bg = cfg.bg, bc = cfg.bc;

    var dsptf, dsphur, dspmin;      // 上次显示的值，用于比对
    var maintimer = null;
    var isActive = false;
    var body;

    /* ------------------------------------------------------------------ *
     * 3. 翻转方向判定 —— 原样照抄
     *    这几条决定 1 / 11 该往哪边翻，是"看起来一模一样"的关键
     * ------------------------------------------------------------------ */
    function isHurOne(t, h)        { return Boolean((t === 0 && h === 1) || (t === 0 && h === 13) || (t === 2 && h === 1)); }
    function isHurEleven(t, h)     { return Boolean(h === 11 || (t === 0 && h === 23) || (t === 1 && h === 1) || (t >= 1 && h !== 1 && h % 10 === 1)); }
    function isHurJustEleven(t, h) { return Boolean(h === 11 || (t === 0 && h === 23)); }
    function isMinEleven(m)        { return Boolean(m % 10 === 1); }
    function isMinJustEleven(m)    { return Boolean(m === 11); }

    /* ------------------------------------------------------------------ *
     * 4. DOM：克隆层构建 —— 照原版的命名规则
     *    产生 8 个元素：
     *      hur-top-org / hur-top-clone / hur-bottom-org / hur-bottom-clone
     *      min-top-org / min-top-clone / min-bottom-org / min-bottom-clone
     * ------------------------------------------------------------------ */
    var el = {};        // id → 元素，构建后缓存，省掉反复查询

    function buildClones() {
        var flips = document.querySelectorAll('.flip');

        // 第一轮：每个 .flip 克隆一份当"动画层"
        Array.prototype.forEach.call(flips, function (node) {
            var clone = node.cloneNode(true);
            clone.classList.add('clone');
            node.parentNode.appendChild(clone);
        });

        // 第二轮：命名 + 塞一个装数字的 span
        var all = document.querySelectorAll('.flip');
        Array.prototype.forEach.call(all, function (node) {
            var kind = node.classList.contains('hur')   ? 'hur'    : 'min';
            var side = node.classList.contains('top')   ? 'top'    : 'bottom';
            var role = node.classList.contains('clone') ? 'clone'  : 'org';

            node.id = kind + '-' + side + '-' + role;
            node.dataset.hm = kind;

            if (!node.querySelector('span')) {
                node.appendChild(document.createElement('span'));
            }

            el[node.id] = node;
        });
    }

    /* ------------------------------------------------------------------ *
     * 5. 渲染：把值写进对应元素
     * ------------------------------------------------------------------ */

    /// 小时显示的文本（12h 制把 0/13+ 折回去，24h 制补零）
    function hourText(t, h) {
        if (t === 0) return (h === 0 || h >= 13) ? Math.abs(h - 12) : h;
        return (h < 10) ? ('0' + h) : h;
    }

    /// 给某个"半边"元素刷小时相关的 class + 文本
    function paintHour(node) {
        if (!node) return;
        node.classList.toggle('tf0',        dsptf === 0);
        node.classList.toggle('pm',         dsptf === 0 && dsphur >= 12);
        node.classList.toggle('one',        isHurOne(dsptf, dsphur));
        node.classList.toggle('eleven',     isHurEleven(dsptf, dsphur));
        node.classList.toggle('justeleven', isHurJustEleven(dsptf, dsphur));
        setText(node, hourText(dsptf, dsphur));   // AM/PM 由 CSS :before 画
    }

    /// 给某个"半边"元素刷分钟相关的 class + 文本
    function paintMin(node) {
        if (!node) return;
        node.classList.toggle('eleven',     isMinEleven(dspmin));
        node.classList.toggle('justeleven', isMinJustEleven(dspmin));
        setText(node, dspmin);
    }

    function setText(node, value) {
        var span = node.querySelector('span');
        if (span) span.textContent = value;
    }

    /// 批量：所有 .hur / .min
    function allOf(kind) { return document.querySelectorAll('.flip.' + kind); }

    function forEachNode(list, fn) { Array.prototype.forEach.call(list, fn); }

    /* ------------------------------------------------------------------ *
     * 6. _updateTime —— 250ms 轮询，照原版
     * ------------------------------------------------------------------ */
    function updateTime(force) {
        var now = new Date();
        var d   = now.getHours();
        var e   = now.getMinutes();
        var f   = now.getSeconds();

        if (f === 59 && !body.classList.contains('willchange')) body.classList.add('willchange');

        // 分钟补零后即成为显示值（原版如此，dspmin 存的是字符串）
        e = (e < 10) ? ('0' + e) : e;

        // ── 首次 / 强制：直接摆好，不放动画 ──
        if (!isActive || force || dsphur === undefined || dspmin === undefined) {
            if (d !== dsphur || e !== dspmin || tf !== dsptf) {
                document.getElementById('main-content-area').classList.add('stop');
                forEachNode(document.querySelectorAll('.flip'), function (n) {
                    n.classList.remove('transform', 'fadein', 'fadeout1', 'fadeout2');
                });

                dsphur = d; dspmin = e; dsptf = tf;
                forEachNode(allOf('hur'), paintHour);
                forEachNode(allOf('min'), paintMin);

                body.classList.remove('hlock', 'mlock');
            }
            return;
        }

        // ── 常态：变了才翻 ──
        if (d !== dsphur || e !== dspmin || tf !== dsptf) {
            var mChanged  = (e !== dspmin && !body.classList.contains('mlock'));
            var hChanged  = (d !== dsphur && !body.classList.contains('hlock'));
            var tfChanged = (tf !== dsptf && !body.classList.contains('hlock'));

            if (mChanged) dspmin = e;
            if (hChanged) dsphur = d;

            if (mChanged || hChanged || tfChanged) {
                updateFlips(Boolean(hChanged || tfChanged), mChanged);

                if (isMobileApp) {
                    var handlers = window.webkit && window.webkit.messageHandlers;
                    if (handlers && handlers.impactHapticFeedback) {
                        try { handlers.impactHapticFeedback.postMessage((mChanged && hChanged) ? 1 : 0); } catch (err) {}
                    }
                }
            }
        } else if (!body.classList.contains('hlock') && !body.classList.contains('mlock')
                   && body.classList.contains('willchange') && f !== 59) {
            body.classList.remove('willchange');
        }
    }

    /* ------------------------------------------------------------------ *
     * 7. _updateFlips —— 翻页动画的编排
     *
     * 完整照抄原版的四段式状态机。这里曾经吃过亏：
     * 一开始我图省事，用「加 class → 340ms 后统一清掉」代替，
     * 结果 ①下半边翻得太早（原版是上边转完才启动下边）②org 层的文字没刷新，
     * 旧数字从新数字的缝隙里透出来，就是肉眼看到的「残影」。
     * 原版靠 animationend 逐段推进，一步都不能省。
     * ------------------------------------------------------------------ */
    function updateFlips(h, m) {
        document.getElementById('main-content-area').classList.remove('stop');

        if (h) {
            setTimeout(function () {
                dsptf = tf;
                el['hur-top-clone'].classList.add('act', 'transform');
                paintHour(el['hur-top-org']);
                el['hur-top-org'].classList.add('fadein');
                paintHour(el['hur-bottom-clone']);
                el['hur-bottom-org'].classList.add('fadeout1');
            }, m ? 10 : 0);
        }

        if (m) {
            setTimeout(function () {
                el['min-top-clone'].classList.add('act', 'transform');
                paintMin(el['min-top-org']);
                el['min-top-org'].classList.add('fadein');
                paintMin(el['min-bottom-clone']);
                el['min-bottom-org'].classList.add('fadeout1');
            }, 0);
        }
    }

    /* ------------------------------------------------------------------ *
     * 7b. animationend 状态机 —— 原版逐条对应
     * ------------------------------------------------------------------ */
    function bindAnimationHandlers() {

        // ── 上半边 clone：翻转期间上锁，转完后解锁并把下半边放下去 ──
        ['hur-top-clone', 'min-top-clone'].forEach(function (id) {
            var node = el[id];
            if (!node) return;

            node.addEventListener('animationstart', function () {
                body.classList.add(node.dataset.hm === 'hur' ? 'hlock' : 'mlock');
            });

            node.addEventListener('animationend', function (e) {
                e.stopPropagation();
                var kind = node.dataset.hm;

                node.classList.remove('act', 'transform');
                if (kind === 'hur') paintHour(node); else paintMin(node);

                // ★ 下半边此刻才开始转（原版的机械感就在这一句上）
                var bottomClone = el[kind + '-bottom-clone'];
                if (bottomClone) bottomClone.classList.add('act', 'transform');
            });
        });

        // ── 上半边 org：淡入结束就摘掉 class ──
        ['hur-top-org', 'min-top-org'].forEach(function (id) {
            var node = el[id];
            if (!node) return;
            node.addEventListener('animationend', function (e) {
                e.stopPropagation();
                node.classList.remove('fadein');
            });
        });

        // ── 下半边 clone：转完后，把对应的 org 层也刷成新值 ──
        //    ★ 这一步不能省：.flip 没有背景色，数字直接画在卡片上，
        //      org 层如果还留着旧数字，就会从新数字的缝隙里透出来。
        ['hur-bottom-clone', 'min-bottom-clone'].forEach(function (id) {
            var node = el[id];
            if (!node) return;

            node.addEventListener('animationend', function (e) {
                e.stopPropagation();
                var kind = node.dataset.hm;

                node.classList.remove('act', 'transform');

                var org = el[kind + '-bottom-org'];
                if (org) {
                    if (kind === 'hur') paintHour(org); else paintMin(org);
                }

                body.classList.remove(kind === 'hur' ? 'hlock' : 'mlock');
            });
        });

        // ── 下半边 org：两级淡出（fadeout1 → fadeout2 → 清掉）──
        ['hur-bottom-org', 'min-bottom-org'].forEach(function (id) {
            var node = el[id];
            if (!node) return;
            node.addEventListener('animationend', function (e) {
                e.stopPropagation();
                if (node.classList.contains('fadeout1')) {
                    node.classList.remove('fadeout1');
                    node.classList.add('fadeout2');
                } else {
                    node.classList.remove('fadeout2');
                }
            });
        });
    }

    /* ------------------------------------------------------------------ *
     * 8. 缩放 / 亮度
     * ------------------------------------------------------------------ */

    /// 网页版：在用户设定的比例之外，还要自适应窗口，保证整块钟完整可见
    function viewportFit() {
        var stage = document.getElementById('main-content');
        if (!stage) return 1;

        // CSS 里 #main-content 的原始尺寸
        var baseW = 1326, baseH = 676;
        var availW = window.innerWidth  || document.documentElement.clientWidth;
        var availH = window.innerHeight || document.documentElement.clientHeight;

        return Math.min(availW / baseW, availH / baseH);
    }

    function applyScale() {
        var fit = viewportFit();
        var user = clamp(sc, SC_MIN, SC_MAX) / 100;
        var factor = fit * user;

        var main = document.getElementById('main');
        if (main) main.style.transform = 'scale(' + factor + ')';

        // 记录给自检用
        window.__fliqloXScale = factor;
    }

    function applyBrightness() {
        // 原版语义：bc 是亮度开关。bc=false 时亮度强制拉满，忽略 br 的设置。
        //（对照原版 `'filter':'brightness('+((bc)?br:brMax)+'%)'`）
        var v = bc ? clamp(br, BR_MIN, BR_MAX) : 100;
        body.style.filter = 'brightness(' + (v / 100) + ')';
    }

    /* ------------------------------------------------------------------ *
     * 9. 扩展功能（默认关闭）
     * ------------------------------------------------------------------ */

    function renderSeconds() {
        var existing = document.getElementById('fliqloX-seconds');
        if (!cfg.showSeconds) { if (existing) existing.parentNode.removeChild(existing); return; }
        if (!existing) {
            existing = document.createElement('div');
            existing.id = 'fliqloX-seconds';
            body.appendChild(existing);
        }
        var s = new Date().getSeconds();
        existing.textContent = (s < 10 ? '0' : '') + s;
    }

    function renderDate() {
        var existing = document.getElementById('fliqloX-date');
        if (!cfg.showDate && !cfg.showWeekday) { if (existing) existing.parentNode.removeChild(existing); return; }
        if (!existing) {
            existing = document.createElement('div');
            existing.id = 'fliqloX-date';
            body.appendChild(existing);
        }
        var now = new Date(), parts = [];
        if (cfg.showWeekday) parts.push(now.toLocaleDateString(cfg.locale, { weekday: 'long' }));
        if (cfg.showDate)    parts.push(now.toLocaleDateString(cfg.locale, { month: 'long', day: 'numeric' }));
        existing.textContent = parts.join(' · ');
    }

    /* ------------------------------------------------------------------ *
     * 10. 心跳
     * ------------------------------------------------------------------ */
    function startMainTimer() {
        stopMainTimer();
        maintimer = setInterval(function () {
            updateTime(false);
            if (cfg.showSeconds) renderSeconds();
            if (cfg.showDate || cfg.showWeekday) renderDate();
        }, 250);
    }

    function stopMainTimer() {
        if (maintimer) { clearInterval(maintimer); maintimer = null; }
    }

    /* ------------------------------------------------------------------ *
     * 11. 对外接口
     * ------------------------------------------------------------------ */
    window.__fliqloX = {
        resume: function () {
            isActive = true;
            updateTime(true);
            startMainTimer();
        },
        pause: function () {
            isActive = false;
            stopMainTimer();
        },
        applyConfig: function (incoming) {
            mergeConfig(incoming);
            tf = cfg.tf; sc = cfg.sc; br = cfg.br; bg = cfg.bg; bc = cfg.bc;

            applyScale();
            applyBrightness();
            body.classList.toggle('dark', !bg);

            updateTime(true);
            renderSeconds();
            renderDate();
        },
        setConfig: function (patch) {
            mergeConfig(patch);
            saveConfig();
            window.__fliqloX.applyConfig(cfg);
        },
        getConfig: function () { return JSON.parse(JSON.stringify(cfg)); },
        refreshLayout: function () { applyScale(); }
    };

    /* ------------------------------------------------------------------ *
     * 12. 启动
     * ------------------------------------------------------------------ */
    function boot() {
        body = document.body;
        loadConfig();

        tf = cfg.tf; sc = cfg.sc; br = cfg.br; bg = cfg.bg; bc = cfg.bc;

        document.documentElement.classList.add(isScreensaver ? 'screensaver' : 'no-screensaver');
        document.documentElement.classList.add(isMac ? 'mac' : 'no-mac');

        buildClones();
        bindAnimationHandlers();

        body.classList.toggle('dark', !bg);
        applyScale();
        applyBrightness();

        updateTime(true);

        window.addEventListener('resize', function () { applyScale(); });
        window.addEventListener('orientationchange', function () { applyScale(); });

        setTimeout(function () {
            var loader = document.getElementById('loader');
            if (loader) loader.classList.add('remove');

            isActive = true;
            updateTime(true);
            startMainTimer();

            // 告诉宿主（桌面版）可以了
            postToHost({ event: 'ready' });
        }, 100);
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', boot);
    } else {
        boot();
    }

})();

</script>
<script>
/* ── 网页版宿主：全屏切换 + 提示淡出 ──────────────────────────────────
   与时钟逻辑无关，纯浏览器交互，所以留在页面里而不进 fliqloX.js。
   桌面版（屏保 / 手机 App）由原生宿主接管，不加载这段。            */
(function () {
    var hint = document.getElementById('fliqloX-hint');
    var isScreensaver = navigator.userAgent.indexOf('Fliqlo') >= 0
                     && navigator.userAgent.indexOf('Screensaver') >= 0;

    // 屏保环境下不需要这些网页交互
    if (isScreensaver) { if (hint) hint.remove(); return; }

    // 提示：6 秒后淡出，鼠标一动就提前淡出
    var dismissed = false;
    function dismissHint() {
        if (dismissed || !hint) return;
        dismissed = true;
        hint.classList.add('gone');
    }
    setTimeout(dismissHint, 6000);
    window.addEventListener('mousemove', dismissHint, { once: true });
    window.addEventListener('touchstart', dismissHint, { once: true });

    // 全屏
    function toggleFullscreen() {
        var root = document.documentElement;
        if (document.fullscreenElement || document.webkitFullscreenElement) {
            (document.exitFullscreen || document.webkitExitFullscreen || function () {}).call(document);
        } else {
            (root.requestFullscreen || root.webkitRequestFullscreen || function () {}).call(root);
        }
    }

    window.addEventListener('dblclick', toggleFullscreen);
    window.addEventListener('keydown', function (e) {
        if (e.key === 'f' || e.key === 'F') toggleFullscreen();
    });

    // 全屏状态变化后重算缩放（浏览器 UI 收起会改变可视高度）
    ['fullscreenchange', 'webkitfullscreenchange'].forEach(function (name) {
        document.addEventListener(name, function () {
            setTimeout(function () {
                if (window.__fliqloX) window.__fliqloX.refreshLayout();
            }, 120);
        });
    });
})();
</script>
<script>
window.__fliqloXBootConfig = {"tf":0,"sc":100,"br":100,"bg":true,"bc":true,"showSeconds":false,"showDate":false,"showWeekday":false,"locale":"zh-Hans"};
</script>
